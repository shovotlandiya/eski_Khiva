# main branch'ga har push qilinganda saytni yig'ib, GitHub Pages'ga joylaydi.
# Bir martalik sozlash: GitHub'da Settings → Pages → Source: "GitHub Actions" ni tanlang.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          # Masalan: /eski_Khiva/
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      # Har bir sahifa uchun .html nusxalar va 404.html'ni vite.config.js'dagi plagin yaratadi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
