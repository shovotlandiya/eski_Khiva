<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Xiva xonligining saqlanib qolgan tarixiy binolari 3D formatda." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!-- Shriftlar: sarlavhalar — Unbounded (zamonaviy), matn — Inter, texnik yorliqlar — JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <script>
      // Hero videosining muqovasini JS yuklanishini kutmasdan oldindan yuklaymiz (Hero.jsx'dagi POSTER bilan bir xil).
      // Faqat bosh sahifada — boshqa sahifalarda bu rasm kerak emas. %BASE_URL% ni Vite build vaqtida almashtiradi.
      var base = '%BASE_URL%'
      if (location.pathname === base) {
        document.head.appendChild(Object.assign(document.createElement('link'), {
          rel: 'preload',
          as: 'image',
          type: 'image/webp',
          fetchPriority: 'high',
          href: base + 'images/hero/3d-poster.webp',
        }))
      }
    </script>
    <title>Eski Xiva</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
